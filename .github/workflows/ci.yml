name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays: is the package still written from the API as it is today?
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e . --group test --group lint
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest tests/unit_tests --disable-socket --allow-unix-socket

  api:
    # The tools are written from the live OpenAPI document; this fails when it has moved on.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install --group lint
      - run: python scripts/generate.py && ruff format langchain_fokals/_generated.py
      - run: git diff --exit-code langchain_fokals/_generated.py
